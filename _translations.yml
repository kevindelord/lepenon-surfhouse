      subtitle:
        en: "Le Penon Surf House is situated in Seignosse Le Penon on the French Atlantic coast. The South West is famous for its perfect beach-breaks, beautiful beaches and some of the best surf spots in Europe.<br />The accomodation has a fast access to the beach only 150 meters away, a parking lot and a swimming pool on the premises of the Résidence Atlantique! Just around the corner there is all you need for an amazing vacation with surf schools, bars, restaurants, shops, a skatepark and even a beach club to hype the night life."
        fr: "Le Penon Surf House est situé à Seignosse Le Penon, sur la côte atlantique française. Le Sud-Ouest est célèbre pour ses beach-breaks parfaits, ses plages magnifiques et certains des meilleurs spots de surf d'Europe.<br />Le logement dispose d'un accès rapide à la plage à seulement 150 mètres, d'une place de parking et d'une piscine sur la propriété de la Résidence Atlantique! Au coin de la rue, vous trouverez tout ce dont vous avez besoin pour passer des vacances exceptionnelles: écoles de surf, bars, restaurants, boutiques, skatepark et même un club de plage pour faire la fête."
        de: "Le Penon Surf House befindet sich in Seignosse Le Penon an der französischen Atlantikküste. Der Südwesten Frankreichs ist berühmt für seine perfekten Beachbreaks, wunderschönen Strände und einige der besten Surfspots Europas.<br />Die Unterkunft verfügt über einen schnellen Strandzugang (nur 150 m entfernt), einen Parkplatz und ein Schwimmbad auf dem Grundstück der Résidence Atlantique. Gleich um die Ecke gibt es alles, was man für einen tollen Urlaub braucht, mit Surfschulen, Bars, Restaurants, Geschäften, einem Skatepark und sogar einem Beach-Club, um das Nachtleben zu beleben."
      priceRange:
        en: "€90 - €250 per night"
        fr: "90 € - 250 € par nuit"
        de: "90 € - 250 € pro Nacht"
      partners:
